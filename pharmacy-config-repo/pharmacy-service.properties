# ===== PHARMACY SERVICE CONFIG =====
server.port=8085
spring.application.name=pharmacy-service

# ===== DATABASE POSTGRESQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/pharmacy_db
spring.datasource.username=postgres
spring.datasource.password=anhtuansql
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== EUREKA =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===== THÔNG TIN CHI NHÁNH =====
app.branch-name=Nha Thuoc So 1
app.hotline=1900xxxx
app.address=123 Đường Lê Lợi, Quận 1, TP.HCM
app.open-time=08:00
app.close-time=22:00

# VAT 5% ban đầu
pharmacy.vat-rate=0.10
pharmacy.currency=VND
# Giảm giá 2% cho thành viên
pharmacy.discount-member=0.02

# ===== RESILIENCE4J — CIRCUIT BREAKER =====
# Cấu hình cho việc gọi warehouse-service (Kho tổng)
resilience4j.circuitbreaker.instances.warehouseCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.warehouseCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.warehouseCB.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.warehouseCB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.warehouseCB.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.warehouseCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.warehouseCB.register-health-indicator=true

# Log khi trạng thái CB thay đổi
logging.level.io.github.resilience4j=DEBUG